[project]
name = "calibrlab"
version = "0.2.0"
description = "Confidence calibration from scratch: ECE/MCE/Brier/NLL metrics and temperature scaling fit on validation NLL"
requires-python = ">=3.10"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["calibrlab*"]

[tool.setuptools.package-data]
calibrlab = ["ledger_data/*.json"]
